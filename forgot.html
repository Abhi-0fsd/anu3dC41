<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{ box-sizing:border-box; }

body{
  margin:0;
  font-family: Arial;
}

/* HEADER */
.back-header{
  background:#f5f5dc;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.left-header{
  display:flex;
  align-items:center;
  gap:15px;
}

.back-btn{
  color:#201d1f;
  font-size:20px;
  text-decoration:none;
}

/* BUTTON STATES */
button:disabled {
  background:#ccc;
  cursor:not-allowed;
  opacity:0.6;
}

button:not(:disabled){
  background:#ac1896;
}

/* CART */
.cart-link{
  position:relative;
  text-decoration:none;
  color:#ac1896;
  font-size:25px;
}

.cart-count{
  position:absolute;
  top:-5px;
  right:-8px;
  background:red;
  color:white;
  font-size:12px;
  width:18px;
  height:18px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* MAIN */
.main{
  display:flex;
  justify-content:center;
  padding:40px;
}

/* LOGIN BOX */
.login-box{
  width:100%;
  max-width:400px;
  background:#f5f5dc;
  border-radius:8px;
  border:1px solid #ddd;
  overflow:hidden;
}

/* TITLE */
.login-title{
  background:#ac1896;
  color:white;
  padding:15px;
  font-size:20px;
  font-weight:bold;
  text-align:center;
}

/* CONTENT */
.container{
  padding:25px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  font-size:14px;
  font-weight:bold;
  display:block;
  margin-bottom:5px;
}

/* INPUT */
.input-box{
  position:relative;
}

.input-box input{
  width:100%;
  padding:10px 35px 10px 10px;
  border:1px solid #a6a6a6;
  border-radius:4px;
}

/* EYE ICON */
.toggle-eye{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  color:#666;
}

.toggle-eye:hover{
  color:#ac1896;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:6px;
  cursor:pointer;
  margin-top:10px;
}

/* FOOTER */
.footer{
  margin-top:20px;
  text-align:center;
}

.link{
  color:#ac1896;
  text-decoration:none;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  background:#f5f5dc;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
}

.bottom-nav a{
  text-decoration:none;
  color:#ac1896;
  font-size:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.bottom-nav i{
  font-size:20px;
}

input:invalid {
  border-color:red;
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="back-header">
  <div class="left-header">
    <a href="index.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <img src="https://i.postimg.cc/R05VcqPF/MAIN-LOGO.jpg" width="40">
    <b style="color:#ac1896;">ANU 3D Printing</b>
  </div>

  <a href="cart.html" class="cart-link">
    🛒 <span class="cart-count">0</span>
  </a>
</header>

<!-- MAIN -->
<div class="main">
  <div class="login-box">

    <div class="login-title">Forgot Password</div>

    <div class="container">

      <!-- EMAIL -->
      <div class="form-group">
        <label>Email</label>
        <div class="input-box">
          <input type="email" id="email"
          placeholder="Enter email"
          autocomplete="off"
          oninput="checkForm()">
        </div>
      </div>

      <!-- NEW PASSWORD -->
      <div class="form-group">
        <label>New Password</label>
        <div class="input-box">
          <input type="password" id="newPassword"
          placeholder="Enter New Password"
          autocomplete="new-password"
          oninput="checkForm()">
          <i class="fa fa-eye toggle-eye"
          onclick="togglePassword('newPassword', this)"></i>
        </div>
      </div>

      <!-- CONFIRM PASSWORD -->
      <div class="form-group">
        <label>Re-enter Password</label>
        <div class="input-box">
          <input type="password" id="confirmPassword"
          placeholder="Re-enter Password"
          autocomplete="new-password"
          oninput="checkForm()">
          <i class="fa fa-eye toggle-eye"
          onclick="togglePassword('confirmPassword', this)"></i>
        </div>
      </div>

      <!-- BUTTON -->
      <button id="loginBtn" disabled onclick="resetPassword()">
        Reset Password
      </button>

      <div class="footer">
        New User? <a href="login.html" class="link">Login</a>
      </div>

    </div>
  </div>
</div>

<!-- FOOTER -->
<div class="bottom-nav">
  <a href="index.html"><i class="fa-solid fa-house"></i>Home</a>
  <a href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
  <a href="index.html"><i class="fa-solid fa-magnifying-glass"></i>Search</a>
  <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i>Cart</a>
  <a href="contacts.html"><i class="fa-solid fa-headset"></i>Help</a>
</div>

<script>
// 👁️ TOGGLE PASSWORD
function togglePassword(id, icon){
  let input = document.getElementById(id);

  if(input.type === "password"){
    input.type = "text";
    icon.classList.replace("fa-eye","fa-eye-slash");
  } else {
    input.type = "password";
    icon.classList.replace("fa-eye-slash","fa-eye");
  }
}

// ✅ VALIDATION
function checkForm(){
  let email = document.getElementById("email").value.trim();
  let newPassword = document.getElementById("newPassword").value.trim();
  let confirmPassword = document.getElementById("confirmPassword").value.trim();
  let btn = document.getElementById("loginBtn");

  let emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  let passwordsMatch = newPassword && confirmPassword && (newPassword === confirmPassword);

  btn.disabled = !(emailValid && passwordsMatch);
}

// 🔐 RESET PASSWORD
function resetPassword(){
  let newPassword = document.getElementById("newPassword").value;
  let confirmPassword = document.getElementById("confirmPassword").value;

  if(newPassword !== confirmPassword){
    alert("Passwords do not match ❌");
    return;
  }

  alert("Password Reset Successful ✅");
  window.location.href = "login.html";
}
</script>

</body>
</html>
