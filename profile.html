<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<style>
body{
  font-family:Arial;
  background:#eef6ff;
  text-align:center;
  padding-top:50px;
  margin:0;
}

/* HEADER */
.back-header{
  background:#f5f5dc;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top: -50px;
}

.left-header{
  display:flex;
  align-items:center;
  gap:15px;
}

.back-btn{
  color:#201d1f;
  font-size:20px;
  text-decoration:none;
}

/* BUTTON STATES */
button:disabled {
  background:#ccc;
  cursor:not-allowed;
  opacity:0.6;
}

button:not(:disabled){
  background:#ac1896;
}

/* CART */
.cart-link{
  position:relative;
  text-decoration:none;
  color:#ac1896;
  font-size:25px;
}

.cart-count{
  position:absolute;
  top:-5px;
  right:-8px;
  background:red;
  color:white;
  font-size:12px;
  width:18px;
  height:18px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}


.profile-box{
  width:90%;
  max-width:350px;
  margin:auto;
  background:white;
  padding:30px;
  border-radius:12px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.avatar{
  width:120px;
  height:120px;
  border-radius:50%;
  background:#ac1896;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
  margin:auto;
  margin-bottom:20px;
}

h2{
  margin:10px 0;
  color:#333;
}

p{
  color:#666;
  font-size:16px;
}

button{
  padding:12px 25px;
  background:red;
  color:white;
  border:none;
  border-radius:6px;
  margin-top:20px;
  cursor:pointer;
  font-size:15px;
}

button:hover{
  opacity:0.9;
}

/* FOOTER */
.footer{
  margin-top:20px;
  text-align:center;
}

.link{
  color:#ac1896;
  text-decoration:none;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  background:#f5f5dc;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
}

.bottom-nav a{
  text-decoration:none;
  color:#ac1896;
  font-size:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.bottom-nav i{
  font-size:20px;
}

input:invalid {
  border-color:red;
}
</style>
</head>

<body>
  <header class="back-header">
  <div class="left-header">
    <a href="index.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <img src="https://i.postimg.cc/R05VcqPF/MAIN-LOGO.jpg" width="40">
    <b style="color:#ac1896;">ANU 3D Printing</b>
  </div>

  <a href="cart.html" class="cart-link">
    🛒 <span class="cart-count">0</span>
  </a>
</header>

<div class="profile-box">

  <div id="avatar"></div>

  <h2 id="name"></h2>

  <p id="email"></p>

  <button onclick="logout()">Logout</button>

</div>

<!-- FOOTER -->
<div class="bottom-nav">
  <a href="index.html"><i class="fa-solid fa-house"></i>Home</a>
  <a href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
  <a href="index.html"><i class="fa-solid fa-magnifying-glass"></i>Search</a>
  <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i>Cart</a>
  <a href="contacts.html"><i class="fa-solid fa-headset"></i>Help</a>
</div>

<script>

// GET SIGNUP USER DATA
let user = JSON.parse(localStorage.getItem("user"));

// GET LOGIN EMAIL
let loggedEmail = localStorage.getItem("userLogin");

// CHECK LOGIN
if(user && loggedEmail){

  // SHOW NAME
  document.getElementById("name").innerText =
  user.name;

  // SHOW EMAIL
  document.getElementById("email").innerText =
  loggedEmail;

  // FIRST LETTER AVATAR
  let letter =
  user.name.charAt(0).toUpperCase();

  document.getElementById("avatar").innerHTML =
  `<div class="avatar">${letter}</div>`;

}else{

  alert("Please login first 🔐");

  window.location.href = "login.html";
}

// LOGOUT
function logout(){

  // REMOVE LOGIN ONLY
  localStorage.removeItem("userLogin");

  alert("Logged out successfully 👋");

  window.location.href = "index.html";
}

</script>

</body>
</html>
